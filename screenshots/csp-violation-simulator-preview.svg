<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#0a0d14; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#101622"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad2)"/>

  <!-- Top Bar -->
  <rect width="1200" height="64" fill="#101622" stroke="#233047" stroke-width="1"/>
  <text x="32" y="38" fill="#ffffff" font-size="18" font-weight="700">CSPForge Pro</text>
  <text x="165" y="38" fill="#8b5cf6" font-size="14" font-weight="600">— W3C Threat Violation &amp; Report Simulator</text>

  <!-- Left Threat Form -->
  <g transform="translate(32, 90)" filter="url(#shadow2)">
    <rect width="550" height="550" rx="12" fill="#131b2b" stroke="#233047" stroke-width="1"/>
    <text x="24" y="36" fill="#ffffff" font-size="16" font-weight="700">Simulate Inbound Threat Vector</text>

    <text x="24" y="75" fill="#94a3b8" font-size="12" font-weight="600">THREAT / OPERATION VECTOR</text>
    <rect x="24" y="85" width="502" height="36" rx="6" fill="#172133" stroke="#233047"/>
    <text x="36" y="108" fill="#f1f5f9" font-size="13">Inline Script Injection (&lt;script&gt;alert(1)&lt;/script&gt;)</text>

    <text x="24" y="145" fill="#94a3b8" font-size="12" font-weight="600">SIMULATED PAYLOAD / INJECTED URI</text>
    <rect x="24" y="155" width="502" height="36" rx="6" fill="#172133" stroke="#233047"/>
    <text x="36" y="178" fill="#f1f5f9" font-size="13" font-family="monospace">&lt;script&gt;alert('Steal Session Cookies')&lt;/script&gt;</text>

    <text x="24" y="215" fill="#94a3b8" font-size="12" font-weight="600">SCRIPT NONCE ATTRIBUTE (OPTIONAL)</text>
    <rect x="24" y="225" width="502" height="36" rx="6" fill="#172133" stroke="#233047"/>
    <text x="36" y="248" fill="#64748b" font-size="13" font-family="monospace">Omitted (Simulating unauthenticated attacker XSS)</text>

    <text x="24" y="285" fill="#94a3b8" font-size="12" font-weight="600">DOCUMENT CONTEXT ORIGIN</text>
    <rect x="24" y="295" width="502" height="36" rx="6" fill="#172133" stroke="#233047"/>
    <text x="36" y="318" fill="#f1f5f9" font-size="13" font-family="monospace">https://app.bankcorp.com</text>

    <rect x="24" y="365" width="502" height="42" rx="6" fill="#8b5cf6"/>
    <text x="275" y="391" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Execute Browser Enforcement Flight-Check</text>
  </g>

  <!-- Right Simulation Verdict & W3C Report -->
  <g transform="translate(618, 90)" filter="url(#shadow2)">
    <rect width="550" height="550" rx="12" fill="#131b2b" stroke="#233047" stroke-width="1"/>
    <text x="24" y="36" fill="#ffffff" font-size="16" font-weight="700">Enforcement &amp; Violation Results</text>

    <!-- Verdict Banner -->
    <rect x="24" y="55" width="502" height="60" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="275" y="82" fill="#10b981" font-size="18" font-weight="800" text-anchor="middle">STATUS: BLOCKED</text>
    <text x="275" y="102" fill="#10b981" font-size="12" text-anchor="middle">Browser terminated execution. XSS threat mitigated by CSP Level 3 policy.</text>

    <text x="24" y="145" fill="#ffffff" font-size="13" font-weight="700">Decision Reason:</text>
    <rect x="24" y="155" width="502" height="50" rx="6" fill="#172133" stroke="#233047"/>
    <text x="36" y="185" fill="#f1f5f9" font-size="12">Blocked: Inline scripts require a valid cryptographic nonce or hash in CSP3.</text>

    <text x="24" y="235" fill="#ffffff" font-size="13" font-weight="700">Generated W3C CSP Violation Report (POST /csp-report):</text>
    <rect x="24" y="245" width="502" height="275" rx="6" fill="#080a10" stroke="#233047"/>
    <text x="36" y="270" fill="#06b6d4" font-size="11" font-family="monospace">{</text>
    <text x="48" y="290" fill="#e2e8f0" font-size="11" font-family="monospace">"csp-report": {</text>
    <text x="60" y="310" fill="#e2e8f0" font-size="11" font-family="monospace">"document-uri": "https://app.bankcorp.com/dashboard",</text>
    <text x="60" y="330" fill="#e2e8f0" font-size="11" font-family="monospace">"violated-directive": "script-src 'self' 'nonce-rAnd0m...' 'strict-dynamic'",</text>
    <text x="60" y="350" fill="#e2e8f0" font-size="11" font-family="monospace">"effective-directive": "script-src",</text>
    <text x="60" y="370" fill="#e2e8f0" font-size="11" font-family="monospace">"disposition": "enforce",</text>
    <text x="60" y="390" fill="#e2e8f0" font-size="11" font-family="monospace">"blocked-uri": "inline",</text>
    <text x="60" y="410" fill="#e2e8f0" font-size="11" font-family="monospace">"status-code": 200,</text>
    <text x="60" y="430" fill="#e2e8f0" font-size="11" font-family="monospace">"script-sample": "alert('Steal Session Cookies')"</text>
    <text x="48" y="450" fill="#e2e8f0" font-size="11" font-family="monospace">}</text>
    <text x="36" y="470" fill="#06b6d4" font-size="11" font-family="monospace">}</text>
  </g>
</svg>
