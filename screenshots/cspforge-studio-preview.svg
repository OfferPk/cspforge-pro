<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#0a0d14; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#101622"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>

  <!-- Top Navbar -->
  <rect width="1200" height="64" fill="#101622" stroke="#233047" stroke-width="1"/>
  
  <!-- Logo -->
  <rect x="32" y="16" width="32" height="32" rx="6" fill="url(#accentGrad)"/>
  <path d="M48 22 L40 26 v6 c0 4 3 8 8 9 5-1 8-5 8-9 v-6 z" fill="#ffffff" opacity="0.9"/>
  <text x="76" y="38" fill="#ffffff" font-size="18" font-weight="700">CSPForge Pro</text>
  <rect x="206" y="24" width="84" height="18" rx="4" fill="rgba(139, 92, 246, 0.2)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
  <text x="214" y="37" fill="#8b5cf6" font-size="11" font-weight="700">CSP Level 3</text>

  <!-- Nav Action Buttons -->
  <rect x="820" y="18" width="190" height="30" rx="6" fill="#172133" stroke="#233047" stroke-width="1"/>
  <text x="834" y="38" fill="#f1f5f9" font-size="12">Preset: Enterprise Banking</text>
  <rect x="1022" y="18" width="146" height="30" rx="6" fill="#8b5cf6"/>
  <text x="1046" y="38" fill="#ffffff" font-size="12" font-weight="600">Auto-Harden</text>

  <!-- Tab Bar -->
  <rect y="64" width="1200" height="42" fill="#0d121c" stroke="#233047" stroke-width="1"/>
  <text x="48" y="90" fill="#8b5cf6" font-size="13" font-weight="700">✓ 10-Point XSS &amp; CSP Auditor</text>
  <line x1="48" y1="105" x2="250" y2="105" stroke="#8b5cf6" stroke-width="2"/>
  <text x="280" y="90" fill="#94a3b8" font-size="13">Violation &amp; Attack Simulator</text>
  <text x="500" y="90" fill="#94a3b8" font-size="13">Production Middleware Synthesizer</text>
  <text x="750" y="90" fill="#94a3b8" font-size="13">Directive Policy Editor</text>

  <!-- Score Panel -->
  <g transform="translate(32, 130)" filter="url(#shadow)">
    <rect width="280" height="490" rx="12" fill="#131b2b" stroke="#233047" stroke-width="1"/>
    
    <circle cx="140" cy="110" r="55" fill="none" stroke="#233047" stroke-width="8"/>
    <circle cx="140" cy="110" r="55" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="345" stroke-dashoffset="0"/>
    <text x="140" y="112" fill="#ffffff" font-size="34" font-weight="800" text-anchor="middle" font-family="monospace">100</text>
    <text x="140" y="132" fill="#64748b" font-size="11" text-anchor="middle">/ 100 PTS</text>

    <rect x="90" y="185" width="100" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="140" y="204" fill="#10b981" font-size="14" font-weight="800" text-anchor="middle">GRADE A+</text>
    <text x="140" y="235" fill="#94a3b8" font-size="12" text-anchor="middle">Production Hardened</text>

    <!-- Chips -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="55" height="50" rx="6" fill="#172133" stroke="#233047"/>
      <text x="27" y="26" fill="#f43f5e" font-size="18" font-weight="700" text-anchor="middle" font-family="monospace">0</text>
      <text x="27" y="42" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">CRIT</text>

      <rect x="62" y="0" width="55" height="50" rx="6" fill="#172133" stroke="#233047"/>
      <text x="89" y="26" fill="#f59e0b" font-size="18" font-weight="700" text-anchor="middle" font-family="monospace">0</text>
      <text x="89" y="42" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">HIGH</text>

      <rect x="124" y="0" width="55" height="50" rx="6" fill="#172133" stroke="#233047"/>
      <text x="151" y="26" fill="#eab308" font-size="18" font-weight="700" text-anchor="middle" font-family="monospace">0</text>
      <text x="151" y="42" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">MED</text>

      <rect x="186" y="0" width="55" height="50" rx="6" fill="#172133" stroke="#233047"/>
      <text x="213" y="26" fill="#3b82f6" font-size="18" font-weight="700" text-anchor="middle" font-family="monospace">0</text>
      <text x="213" y="42" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">LOW</text>
    </g>

    <line x1="20" y1="335" x2="260" y2="335" stroke="#233047"/>
    <text x="24" y="360" fill="#94a3b8" font-size="12">Script Model: <tspan fill="#10b981" font-weight="600">Nonce + strict-dynamic</tspan></text>
    <text x="24" y="385" fill="#94a3b8" font-size="12">Dynamic eval: <tspan fill="#10b981" font-weight="600">Blocked</tspan></text>
    <text x="24" y="410" fill="#94a3b8" font-size="12">Plugins (object-src): <tspan fill="#10b981" font-weight="600">'none'</tspan></text>
    <text x="24" y="435" fill="#94a3b8" font-size="12">Framing: <tspan fill="#10b981" font-weight="600">'none'</tspan></text>
  </g>

  <!-- Right Passed Controls -->
  <g transform="translate(332, 130)" filter="url(#shadow)">
    <rect width="836" height="490" rx="12" fill="#131b2b" stroke="#233047" stroke-width="1"/>

    <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="700">Passed Security Controls (10/10)</text>
    <rect x="700" y="18" width="110" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="755" y="34" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle">ALL PASSED</text>

    <!-- Controls List -->
    <g transform="translate(24, 60)">
      <rect width="788" height="38" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="24" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="24" fill="#ffffff" font-size="13" font-weight="600">Strict Nonce Overrides 'unsafe-inline':</text>
      <text x="330" y="24" fill="#94a3b8" font-size="13">CSP3 browsers ignore 'unsafe-inline' in the presence of a cryptographic nonce.</text>

      <rect y="44" width="788" height="38" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="68" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="68" fill="#ffffff" font-size="13" font-weight="600">No Execution of data: or blob: Schemes:</text>
      <text x="340" y="68" fill="#94a3b8" font-size="13">Dangerous pseudo-schemes data: and blob: are blocked from script execution.</text>

      <rect y="88" width="788" height="38" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="112" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="112" fill="#ffffff" font-size="13" font-weight="600">Dynamic Code Evaluation Blocked:</text>
      <text x="300" y="112" fill="#94a3b8" font-size="13">eval() and new Function() calls are strictly prohibited.</text>

      <rect y="132" width="788" height="38" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="156" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="156" fill="#ffffff" font-size="13" font-weight="600">Legacy Plugin Injection Blocked:</text>
      <text x="290" y="156" fill="#94a3b8" font-size="13">object-src 'none' completely disables legacy Flash and Java applets.</text>

      <rect y="176" width="788" height="38" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="200" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="200" fill="#ffffff" font-size="13" font-weight="600">Base URL Hijacking Protection:</text>
      <text x="280" y="200" fill="#94a3b8" font-size="13">Document &lt;base&gt; tag is restricted to 'self', preventing relative script redirection.</text>

      <rect y="220" width="788" height="38" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="244" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="244" fill="#ffffff" font-size="13" font-weight="600">Clickjacking Defense Enforced:</text>
      <text x="270" y="244" fill="#94a3b8" font-size="13">frame-ancestors 'none' prohibits invisible iframe UI redressing.</text>

      <rect y="264" width="788" height="38" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="288" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="288" fill="#ffffff" font-size="13" font-weight="600">'strict-dynamic' Overrides Host Whitelists:</text>
      <text x="330" y="288" fill="#94a3b8" font-size="13">Host whitelists are superseded by cryptographic nonces in modern browsers.</text>

      <rect y="308" width="788" height="38" rx="6" fill="#172133" stroke="#233047"/>
      <text x="16" y="332" fill="#10b981" font-weight="700">✓</text>
      <text x="36" y="332" fill="#ffffff" font-size="13" font-weight="600">Default Fallback Defined (default-src):</text>
      <text x="310" y="332" fill="#94a3b8" font-size="13">Unspecified resource types safely inherit baseline security from 'self'.</text>
    </g>
  </g>
</svg>
